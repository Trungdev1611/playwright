<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Price Tracker - Xem dữ liệu cào</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --border: #2a2e3a;
    --text: #e8e8ec;
    --muted: #8b8f9c;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; }
  #meta { color: var(--muted); font-size: 13px; }
  select {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    background: #fff;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .card .name {
    font-size: 13px;
    line-height: 1.4;
    min-height: 36px;
    margin-bottom: 8px;
  }
  .card .price {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-top: auto;
  }
  .card .site-tag {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>📦 Price Tracker</h1>
    <select id="siteSelect"></select>
    <span id="meta"></span>
  </header>
  <div class="grid" id="grid"></div>
  <div id="empty" style="display:none">Không có dữ liệu. Hãy chạy scraper trước (node sites/&lt;ten-site&gt;.js).</div>

<script>
  // Mỗi site cào xong sẽ có 1 file json trong scraper/output/, liệt kê ở đây.
  const DATA_FILES = {
    tgdd: "../scraper/output/tgdd.json",
    cellphones: "../scraper/output/cellphones.json",
    gearvn: "../scraper/output/gearvn.json",
    phongvu: "../scraper/output/phongvu.json",
  };

  const fmtPrice = (n) => n == null ? "?" : n.toLocaleString("vi-VN") + "₫";

  async function loadSite(key) {
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const meta = document.getElementById("meta");
    grid.innerHTML = "";
    try {
      const res = await fetch(DATA_FILES[key] + "?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      meta.textContent = `${data.products.length} sản phẩm · cào lúc ${new Date(data.scraped_at).toLocaleString("vi-VN")}`;
      if (!data.products.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      for (const p of data.products) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = `
          <div class="site-tag">${data.site}</div>
          <img src="${p.image || ""}" alt="" loading="lazy" onerror="this.style.opacity=0.2">
          <div class="name">${p.name}</div>
          <div class="price">${fmtPrice(p.price)}</div>
        `;
        grid.appendChild(a);
      }
    } catch (e) {
      meta.textContent = "";
      empty.textContent = "Lỗi tải dữ liệu: " + e.message;
      empty.style.display = "block";
    }
  }

  const select = document.getElementById("siteSelect");
  for (const key of Object.keys(DATA_FILES)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key.toUpperCase();
    select.appendChild(opt);
  }
  select.addEventListener("change", () => loadSite(select.value));
  loadSite(Object.keys(DATA_FILES)[0]);
</script>
</body>
</html>
